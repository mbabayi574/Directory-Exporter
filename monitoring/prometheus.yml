global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "directory-exporter"
    scrape_interval: 30s
    scrape_timeout:  5s
    static_configs:
      - targets: ["exporter:9200"]
        labels:
          environment: "local"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
